[package]
name = "rustobot5000"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.81"
async-trait = "0.1.80"
bitflags = "2.4.2"
crc32fast = "1.4.0"
derive_more = { version = "2.1.1", features = ["display", "error"] }
gstreamer = { version = "0.25.0", features = ["v1_20"] }
gstreamer-audio = { version = "0.25.0", features = ["v1_20"] }
gstreamer-pbutils = { version = "0.25.0", features = ["v1_20"] }
gstreamer-video = { version = "0.25.0", features = ["v1_20"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.2.0", features = ["client"] }
paginate = "1.1.11"
percent-encoding = "2.3.1"
poise = "0.6.1"
reqwest = { version = "0.13.2", features = ["json", "rustls", "http2"], default-features = false }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.36.0", features = ["rt-multi-thread", "signal"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
url = "2.5.0"
uuid = { version = "1.8.0", features = ["v4"] }
